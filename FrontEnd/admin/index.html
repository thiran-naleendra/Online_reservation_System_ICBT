<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap");

      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        border: none;
        text-decoration: none;
        text-transform: capitalize;
        transition: 0.2s linear;
      }

      .container {
        background: linear-gradient(45deg, blueviolet, lightgreen);
        padding: 15px 9%;
        padding-bottom: 100px;
      }

      .container .heading {
        text-align: center;
        padding-bottom: 15px;
        color: #fff;
        text-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        font-size: 50px;
      }

      .container .box-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        gap: 15px;
      }

      .container .box-container .box {
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        background: #fff;
        text-align: center;
        padding: 30px 20px;
        display: flex; /* Use flexbox to center content */
        flex-direction: column; /* Align items vertically */
        align-items: center; /* Center items horizontally */
        justify-content: center; /* Center items vertically */
      }

      .container .box-container .box img {
        height: 80px;
        max-width: 100%; /* Ensure the image is responsive */
        height: auto; /* Maintain aspect ratio */
        margin-bottom: 15px; /* Space between image and heading */
      }

      .container .box-container .box h3 {
        color: #444;
        font-size: 22px;
        padding: 10px 0;
      }

      .container .box-container .box p {
        color: #777;
        font-size: 15px;
        line-height: 1.8;
      }

      .container .box-container .box .btn {
        margin-top: 10px;
        display: inline-block;
        background: #333;
        color: #fff;
        font-size: 17px;
        border-radius: 5px;
        padding: 8px 25px;
      }

      .container .box-container .box .btn:hover {
        letter-spacing: 1px;
      }

      .container .box-container .box:hover {
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        transform: scale(1.03);
      }

      @media (max-width: 768px) {
        .container {
          padding: 20px;
        }
      }

      /* Logout Button Styles */
      .logout-btn {
        position: absolute; /* Position it relative to the nearest positioned ancestor */
        top: 15px; /* Space from the top */
        right: 15px; /* Space from the right */
        background: #ff4d4d; /* Red background for logout */
        color: white; /* White text color */
        padding: 10px 15px; /* Padding around the button */
        border-radius: 5px; /* Rounded corners */
        font-size: 16px; /* Font size */
        border: none; /* No border */
        cursor: pointer; /* Cursor pointer on hover */
      }

      .logout-btn:hover {
        background: #ff1a1a; /* Darker red on hover */
      }
    </style>
  </head>
  <body>
    <button class="logout-btn" onclick="logout()">Logout</button> <!-- Logout Button -->

    <div class="container">
      <h1 class="heading">TNW Resturant </h1>

      <div class="box-container">
        <div class="box">
          <img src="image/icon-1.png" alt="" />
          <h3>View Orders</h3>
          <img src="../assets/cart.gif" alt="" width="80px" height="auto" />
          <a href="./oders.html" class="btn">View</a>
        </div>

        <div class="box">
          <img src="image/icon-1.png" alt="" />
          <h3>Add Veg Menu</h3>
          <img src="../assets/menu.gif" alt="" width="60px" height="auto" />
          <a href="./AddVeg.html" class="btn">Add</a>
          <a href="./AddVeg.html" class="btn">Edit</a>
        </div>

        <div class="box">
          <img src="image/icon-1.png" alt="" />
          <h3>Add NonVeg Menu</h3>
          <img src="../assets/menu.gif" alt="" width="60px" height="auto" />
          <a href="./AddNonVeg.html" class="btn">View</a>
          <a href="./editNonVeg.html" class="btn">Edit</a>
        </div>

        <div class="box">
          <img src="image/icon-1.png" alt="" />
          <h3>Add Hotel</h3>
          <img src="../assets/hotel.gif" alt="" width="60px" height="auto" />
          <a href="./addHotel.html" class="btn">View</a>
        </div>

        <div class="box">
          <img src="image/icon-1.png" alt="" />
          <h3>Add Admin</h3>
          <img src="../assets/admin.gif" alt="" width="80px" height="auto" />
          <a href="./addAdmin.html" class="btn">Add</a>
          <a href="./editAdmin.html" class="btn">Edit</a>
        </div>
        <div class="box">
          <img src="image/icon-1.png" alt="" />
          <h3>Users</h3>
          <img src="../assets/user.gif" alt="" width="80px" height="auto" />
          <a href="./userList.html" class="btn">view</a>
        </div>
      </div>
    </div>

    <script>
      // Logout function
      function logout() {
        // Here, you can add your logout logic
        alert("You have been logged out.");
        // Redirect to login page or clear session
        window.location.href = "../index.html"; // Redirect to login page
      }
    </script>
  </body>
</html>
