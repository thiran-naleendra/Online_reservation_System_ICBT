<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TNW Restaurant - Home</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* General Styles */
      body {
        font-family: "Arial", sans-serif;
        background: url("https://images.pexels.com/photos/11299744/pexels-photo-11299744.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1")
          no-repeat center center fixed; 
        background-size: cover; 
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }

      .container {
        text-align: center;
        padding: 30px;
        background: rgba(255, 255, 255, 0.3); /* Transparent background */
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 30px;
      }

      .card {
        background-color: rgba(255, 255, 255, 0.9);
        color: #333;
        border: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      }

      .card-body {
        padding: 30px;
      }

      .btn-custom {
        background-color: #ff7e5f;
        border: none;
        padding: 10px 20px;
        color: white;
        font-weight: bold;
        border-radius: 5px;
        transition: background-color 0.3s;
      }

      .btn-custom:hover {
        background-color: #feb47b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 style="color: #000000;">TNW Restaurant</h1>
      <div class="row justify-content-center">
        <!-- Admin Login -->
        <div class="col-md-4">
          <div class="card mb-4">
            <div class="card-body">
              <h3 class="card-title">Admin Login</h3>
              <p class="card-text">
                Access the admin panel to manage restaurant operations.
              </p>
              <a href="./admin/adminLogin.html" class="btn btn-custom">Admin Login</a>
            </div>
          </div>
        </div>

        <!-- User Login -->
        <div class="col-md-4">
          <div class="card mb-4">
            <div class="card-body">
              <h3 class="card-title">User Login</h3>
              <p class="card-text">
                Sign in to view our exclusive menu and make reservations.
              </p>
              <a href="./user/Login.html" class="btn btn-custom">User Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (for any future interactivity) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
